<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">CRM capability architecture</title><desc id="d">Seven CRM capability domains organized across customer engagement, operations, insight, and platform layers.</desc><rect width="1200" height="500" fill="#fff"/><g font-family="Arial,sans-serif">
