<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d"><title id="t">CRM integration boundary</title><desc id="d">A system boundary diagram showing responsibilities of the CRM platform, integration layer, and internal operational platform.</desc><rect width="1200" height="470" fill="#fff"/><g font-family="Arial,sans-serif">
<rect x="48" y="48" width="338" height="330" fill="#f7f9fc" stroke="#73839b"/><rect x="48" y="48" width="338" height="52" fill="#e9eef5" stroke="#73839b"/><text x="68" y="79" fill="#253858" font-size="14" font-weight="700">CRM / AUTOMATION PLATFORM</text><g fill="#172033" font-size="13"><text x="78" y="144">Customer and lead records</text><text x="78" y="190">SMS, email, phone, inbox</text><text x="78" y="236">Campaigns and appointments</text><text x="78" y="282">Native workflows and reminders</text><text x="78" y="328">Standard marketing reporting</text></g><g stroke="#cbd2dc"><line x1="68" y1="158" x2="366" y2="158"/><line x1="68" y1="204" x2="366" y2="204"/><line x1="68" y1="250" x2="366" y2="250"/><line x1="68" y1="296" x2="366" y2="296"/></g>
<rect x="452" y="112" width="296" height="202" fill="#fff8e8" stroke="#b7791f"/><text x="600" y="145" text-anchor="middle" fill="#5e450f" font-size="13" font-weight="700">INTEGRATION &amp; GOVERNANCE</text><g fill="#172033" font-size="12"><text x="478" y="184">• API and webhook contracts</text><text x="478" y="215">• Identity and record matching</text><text x="478" y="246">• System-of-record ownership</text><text x="478" y="277">• Permissions, logging, failures</text></g>
<rect x="814" y="48" width="338" height="330" fill="#f7f9fc" stroke="#73839b"/><rect x="814" y="48" width="338" height="52" fill="#253858"/><text x="834" y="79" fill="#fff" font-size="14" font-weight="700">INTERNAL OPERATIONS PLATFORM</text><g fill="#172033" font-size="13"><text x="844" y="144">Job and technician workflow</text><text x="844" y="190">Required control points</text><text x="844" y="236">Evidence and quality review</text><text x="844" y="282">AI-assisted grading logic</text><text x="844" y="328">Coaching and recurrence tracking</text></g><g stroke="#cbd2dc"><line x1="834" y1="158" x2="1132" y2="158"/><line x1="834" y1="204" x2="1132" y2="204"/><line x1="834" y1="250" x2="1132" y2="250"/><line x1="834" y1="296" x2="1132" y2="296"/></g>
<g stroke="#627087" stroke-width="1.5" fill="none"><path d="M386 183H452"/><path d="m445 178 7 5-7 5"/><path d="M452 246H386"/><path d="m393 241-7 5 7 5"/><path d="M748 183H814"/><path d="m807 178 7 5-7 5"/><path d="M814 246H748"/><path d="m755 241-7 5 7 5"/></g><g fill="#5c667a" font-size="10"><text x="419" y="172" text-anchor="middle">events</text><text x="419" y="264" text-anchor="middle">updates</text><text x="781" y="172" text-anchor="middle">context</text><text x="781" y="264" text-anchor="middle">status</text></g>
<rect x="48" y="402" width="1104" height="42" fill="#eef3f8" stroke="#cbd2dc"/><text x="68" y="428" fill="#253858" font-size="12"><tspan font-weight="700">Boundary principle:</tspan> standard customer engagement stays in the CRM; differentiating operational controls remain internal.</text></g></svg>
