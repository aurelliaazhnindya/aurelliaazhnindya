<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
 <title id="title">Control-point overview</title><desc id="desc">A matrix connecting workflow controls to evidence, metrics, and management action.</desc>
 <rect width="1200" height="520" rx="18" fill="#0b1220"/><text x="54" y="58" fill="#f8fafc" font-family="Arial,sans-serif" font-size="28" font-weight="700">From Activity to Management Action</text><text x="54" y="88" fill="#94a3b8" font-family="Arial,sans-serif" font-size="15">A control is useful only when it produces evidence, a metric, and a response.</text>
 <g font-family="Arial,sans-serif"><g fill="#94a3b8" font-size="13" font-weight="700"><text x="62" y="142">CONTROL POINT</text><text x="355" y="142">REQUIRED EVIDENCE</text><text x="650" y="142">MEASURE</text><text x="930" y="142">ACTION</text></g>
 <g font-size="15"><rect x="48" y="160" width="1104" height="64" rx="10" fill="#162237"/><text x="62" y="198" fill="#f8fafc">Training current</text><text x="355" y="198" fill="#cbd5e1">Completion record</text><text x="650" y="198" fill="#cbd5e1">Training compliance %</text><text x="930" y="198" fill="#2dd4bf">Assign module</text>
 <rect x="48" y="234" width="1104" height="64" rx="10" fill="#111c2e"/><text x="62" y="272" fill="#f8fafc">Checklist complete</text><text x="355" y="272" fill="#cbd5e1">Required form fields</text><text x="650" y="272" fill="#cbd5e1">First-pass completion %</text><text x="930" y="272" fill="#fbbf24">Return task</text>
 <rect x="48" y="308" width="1104" height="64" rx="10" fill="#162237"/><text x="62" y="346" fill="#f8fafc">Closeout supported</text><text x="355" y="346" fill="#cbd5e1">Photo, reading, signature</text><text x="650" y="346" fill="#cbd5e1">Evidence completeness %</text><text x="930" y="346" fill="#fb7185">Block closeout</text>
 <rect x="48" y="382" width="1104" height="64" rx="10" fill="#111c2e"/><text x="62" y="420" fill="#f8fafc">Issue resolved</text><text x="355" y="420" fill="#cbd5e1">Review &amp; coaching record</text><text x="650" y="420" fill="#cbd5e1">Repeat-issue rate</text><text x="930" y="420" fill="#a78bfa">Escalate pattern</text></g></g>
 <path d="M325 125V460M620 125V460M900 125V460" stroke="#334155"/>
</svg>
