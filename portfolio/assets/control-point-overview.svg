<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="40 92 1120 440" role="img" aria-labelledby="t d"><title id="t">Operational control point matrix</title><desc id="d">A matrix connecting workflow controls with evidence, metrics, thresholds, and management actions.</desc><rect width="1200" height="560" fill="#fff"/><g font-family="Arial,sans-serif">
<rect x="48" y="105" width="1104" height="50" fill="#253858"/><g fill="#fff" font-size="12" font-weight="700"><text x="65" y="136">CONTROL POINT</text><text x="290" y="136">REQUIRED EVIDENCE</text><text x="535" y="136">PRIMARY METRIC</text><text x="765" y="136">TRIGGER</text><text x="950" y="136">MANAGEMENT RESPONSE</text></g>
<g font-size="13"><rect x="48" y="155" width="1104" height="72" fill="#fff" stroke="#d8dde6"/><text x="65" y="184" fill="#172033" font-weight="700">Training readiness</text><text x="65" y="205" fill="#5c667a" font-size="11">Before assignment</text><text x="290" y="195" fill="#172033">Valid completion record</text><text x="535" y="195" fill="#172033">Training compliance %</text><text x="765" y="195" fill="#172033">Expired or missing</text><text x="950" y="195" fill="#172033">Hold assignment; assign module</text>
<rect x="48" y="227" width="1104" height="72" fill="#f7f9fc" stroke="#d8dde6"/><text x="65" y="256" fill="#172033" font-weight="700">Assessment completion</text><text x="65" y="277" fill="#5c667a" font-size="11">Before service begins</text><text x="290" y="267" fill="#172033">Required fields and readings</text><text x="535" y="267" fill="#172033">First-pass completion %</text><text x="765" y="267" fill="#172033">Required item blank</text><text x="950" y="267" fill="#172033">Return task for completion</text>
<rect x="48" y="299" width="1104" height="72" fill="#fff" stroke="#d8dde6"/><text x="65" y="328" fill="#172033" font-weight="700">Closeout evidence</text><text x="65" y="349" fill="#5c667a" font-size="11">Before job closure</text><text x="290" y="339" fill="#172033">Photos, readings, signature</text><text x="535" y="339" fill="#172033">Evidence completeness %</text><text x="765" y="339" fill="#172033">Evidence below standard</text><text x="950" y="339" fill="#172033">Block closeout; request evidence</text>
<rect x="48" y="371" width="1104" height="72" fill="#f7f9fc" stroke="#d8dde6"/><text x="65" y="400" fill="#172033" font-weight="700">Quality exception</text><text x="65" y="421" fill="#5c667a" font-size="11">After review</text><text x="290" y="411" fill="#172033">Finding and reviewer decision</text><text x="535" y="411" fill="#172033">Rework / repeat-issue rate</text><text x="765" y="411" fill="#172033">Material or recurring issue</text><text x="950" y="411" fill="#172033">Coach, escalate, and monitor</text></g>
<line x1="272" y1="105" x2="272" y2="443" stroke="#d8dde6"/><line x1="517" y1="105" x2="517" y2="443" stroke="#d8dde6"/><line x1="747" y1="105" x2="747" y2="443" stroke="#d8dde6"/><line x1="932" y1="105" x2="932" y2="443" stroke="#d8dde6"/>
<rect x="48" y="477" width="1104" height="42" fill="#fff8e8" stroke="#d6b56f"/><text x="65" y="503" fill="#5e450f" font-size="12"><tspan font-weight="700">Design note:</tspan> thresholds should be approved by management and tested against actual operating data before automation.</text></g></svg>
