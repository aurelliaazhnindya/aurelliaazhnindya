<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">AI-assisted operational review workflow</title><desc id="desc">A future-state workflow separating system automation from management decisions.</desc>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="48" y="46" fill="#172033" font-family="Arial,sans-serif" font-size="25" font-weight="700">Future-State Operational Review Workflow</text>
  <text x="48" y="72" fill="#5c667a" font-family="Arial,sans-serif" font-size="14">Illustrative process — system automation supports, but does not replace, management decisions</text>
  <g font-family="Arial,sans-serif">
    <rect x="48" y="104" width="1104" height="150" fill="#f7f9fc" stroke="#cbd2dc"/><rect x="48" y="254" width="1104" height="206" fill="#ffffff" stroke="#cbd2dc"/>
    <rect x="48" y="104" width="142" height="150" fill="#e9eef5" stroke="#cbd2dc"/><rect x="48" y="254" width="142" height="206" fill="#e9eef5" stroke="#cbd2dc"/>
    <text x="119" y="172" text-anchor="middle" fill="#253858" font-size="15" font-weight="700">SYSTEM</text><text x="119" y="192" text-anchor="middle" fill="#5c667a" font-size="12">automated support</text>
    <text x="119" y="346" text-anchor="middle" fill="#253858" font-size="15" font-weight="700">MANAGEMENT</text><text x="119" y="366" text-anchor="middle" fill="#5c667a" font-size="12">decision ownership</text>
    <g>
      <rect x="222" y="139" width="154" height="74" rx="5" fill="#ffffff" stroke="#73839b" stroke-width="1.5"/><text x="238" y="166" fill="#7a4b00" font-size="11" font-weight="700">01 · CONTROL</text><text x="238" y="190" fill="#172033" font-size="14" font-weight="700">Confirm consent</text>
      <rect x="415" y="139" width="154" height="74" rx="5" fill="#ffffff" stroke="#73839b" stroke-width="1.5"/><text x="431" y="166" fill="#7a4b00" font-size="11" font-weight="700">02 · INPUT</text><text x="431" y="190" fill="#172033" font-size="14" font-weight="700">Capture evidence</text>
      <rect x="608" y="139" width="178" height="74" rx="5" fill="#ffffff" stroke="#73839b" stroke-width="1.5"/><text x="624" y="166" fill="#7a4b00" font-size="11" font-weight="700">03 · ASSESSMENT</text><text x="624" y="190" fill="#172033" font-size="14" font-weight="700">Apply approved rules</text>
      <polygon points="888,132 958,176 888,220 818,176" fill="#fff8e8" stroke="#b7791f" stroke-width="1.5"/><text x="888" y="172" text-anchor="middle" fill="#172033" font-size="13" font-weight="700">Material</text><text x="888" y="190" text-anchor="middle" fill="#172033" font-size="13" font-weight="700">exception?</text>
      <rect x="980" y="139" width="142" height="74" rx="5" fill="#ffffff" stroke="#73839b" stroke-width="1.5"/><text x="996" y="166" fill="#7a4b00" font-size="11" font-weight="700">04 · MONITOR</text><text x="996" y="190" fill="#172033" font-size="14" font-weight="700">Record outcome</text>
    </g>
    <g stroke="#627087" stroke-width="1.5" fill="none"><path d="M376 176H415"/><path d="m408 171 7 5-7 5"/><path d="M569 176H608"/><path d="m601 171 7 5-7 5"/><path d="M786 176H818"/><path d="m811 171 7 5-7 5"/><path d="M958 176H980"/><path d="m973 171 7 5-7 5"/><path d="M888 220V288"/><path d="m883 281 5 7 5-7"/></g>
    <text x="966" y="162" fill="#5c667a" font-size="11">NO</text><text x="900" y="250" fill="#5c667a" font-size="11">YES</text>
    <rect x="714" y="288" width="174" height="76" rx="5" fill="#eef3f8" stroke="#253858" stroke-width="1.5"/><text x="730" y="315" fill="#253858" font-size="11" font-weight="700">05 · HUMAN GATE</text><text x="730" y="339" fill="#172033" font-size="14" font-weight="700">Review evidence</text>
    <rect x="522" y="288" width="154" height="76" rx="5" fill="#ffffff" stroke="#73839b" stroke-width="1.5"/><text x="538" y="315" fill="#253858" font-size="11" font-weight="700">06 · DECISION</text><text x="538" y="339" fill="#172033" font-size="14" font-weight="700">Confirm action</text>
    <rect x="330" y="288" width="154" height="76" rx="5" fill="#ffffff" stroke="#73839b" stroke-width="1.5"/><text x="346" y="315" fill="#253858" font-size="11" font-weight="700">07 · RESPONSE</text><text x="346" y="339" fill="#172033" font-size="14" font-weight="700">Assign coaching</text>
    <rect x="222" y="389" width="666" height="44" rx="4" fill="#f7f9fc" stroke="#cbd2dc"/><text x="240" y="416" fill="#5c667a" font-size="13">Follow-up control:</text><text x="351" y="416" fill="#172033" font-size="13" font-weight="700">track completion and test whether the issue occurs again</text>
    <g stroke="#627087" stroke-width="1.5" fill="none"><path d="M714 326H676"/><path d="m683 321-7 5 7 5"/><path d="M522 326H484"/><path d="m491 321-7 5 7 5"/><path d="M407 364V389"/><path d="m402 382 5 7 5-7"/><path d="M888 411H1051V213"/><path d="m1046 220 5-7 5 7"/></g>
  </g>
  <line x1="48" y1="496" x2="1152" y2="496" stroke="#d8dde6"/><text x="48" y="522" fill="#5c667a" font-family="Arial,sans-serif" font-size="12">Key controls: authorized data only · evidence retained · rules approved by management · material findings require human review</text><text x="1152" y="522" text-anchor="end" fill="#8993a4" font-family="Arial,sans-serif" font-size="12">Portfolio example</text>
</svg>
