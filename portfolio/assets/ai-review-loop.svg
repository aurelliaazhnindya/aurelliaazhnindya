<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
 <title id="title">AI-assisted review loop</title><desc id="desc">A governed loop from consent through evidence capture, rubric analysis, human review, coaching, and recurrence monitoring.</desc>
 <rect width="1200" height="500" rx="18" fill="#0b1220"/><text x="54" y="58" fill="#f8fafc" font-family="Arial,sans-serif" font-size="28" font-weight="700">AI-Assisted Review — Human-Governed Loop</text><text x="54" y="88" fill="#94a3b8" font-family="Arial,sans-serif" font-size="15">AI surfaces evidence and patterns; management owns decisions and coaching.</text>
 <g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(70 145)"><circle cx="90" cy="90" r="72" fill="#162237" stroke="#2dd4bf" stroke-width="3"/><text x="90" y="80" fill="#f8fafc" font-size="17" font-weight="700">Confirm</text><text x="90" y="105" fill="#cbd5e1" font-size="14">consent</text></g><g transform="translate(260 145)"><circle cx="90" cy="90" r="72" fill="#162237" stroke="#38bdf8" stroke-width="3"/><text x="90" y="80" fill="#f8fafc" font-size="17" font-weight="700">Capture</text><text x="90" y="105" fill="#cbd5e1" font-size="14">evidence</text></g><g transform="translate(450 145)"><circle cx="90" cy="90" r="72" fill="#162237" stroke="#a78bfa" stroke-width="3"/><text x="90" y="72" fill="#f8fafc" font-size="17" font-weight="700">Apply approved</text><text x="90" y="98" fill="#cbd5e1" font-size="14">rubric + confidence</text></g><g transform="translate(640 145)"><circle cx="90" cy="90" r="72" fill="#162237" stroke="#fbbf24" stroke-width="3"/><text x="90" y="72" fill="#f8fafc" font-size="17" font-weight="700">Human</text><text x="90" y="98" fill="#cbd5e1" font-size="14">review</text></g><g transform="translate(830 145)"><circle cx="90" cy="90" r="72" fill="#162237" stroke="#fb7185" stroke-width="3"/><text x="90" y="80" fill="#f8fafc" font-size="17" font-weight="700">Coach</text><text x="90" y="105" fill="#cbd5e1" font-size="14">and resolve</text></g><g transform="translate(1020 145)"><circle cx="90" cy="90" r="72" fill="#162237" stroke="#2dd4bf" stroke-width="3"/><text x="90" y="72" fill="#f8fafc" font-size="17" font-weight="700">Monitor</text><text x="90" y="98" fill="#cbd5e1" font-size="14">recurrence</text></g></g>
