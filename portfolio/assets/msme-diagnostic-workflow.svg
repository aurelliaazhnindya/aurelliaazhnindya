<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="t d"><title id="t">MSME diagnostic workflow</title><desc id="d">A six-step workflow from raw records through validation, analysis, warning signals, owner discussion, and action tracking.</desc><rect width="1200" height="390" fill="#fff"/><g font-family="Arial,sans-serif"><rect x="48" y="48" width="1104" height="60" fill="#e9eef5" stroke="#cbd2dc"/><g fill="#253858" font-size="12" font-weight="700"><text x="140" y="83" text-anchor="middle">INPUT</text><text x="326" y="83" text-anchor="middle">PREPARATION</text><text x="512" y="83" text-anchor="middle">DIAGNOSIS</text><text x="698" y="83" text-anchor="middle">WARNING</text><text x="884" y="83" text-anchor="middle">DISCUSSION</text><text x="1070" y="83" text-anchor="middle">FOLLOW-UP</text></g>
<g><rect x="62" y="140" width="156" height="86" rx="5" fill="#fff" stroke="#73839b"/><text x="78" y="168" fill="#7a4b00" font-size="11" font-weight="700">01 · COLLECT</text><text x="78" y="192" fill="#172033" font-size="14" font-weight="700">Business records</text><text x="78" y="211" fill="#5c667a" font-size="10">sales · costs · cash · stock</text><rect x="248" y="140" width="156" height="86" rx="5" fill="#fff" stroke="#73839b"/><text x="264" y="168" fill="#7a4b00" font-size="11" font-weight="700">02 · VALIDATE</text><text x="264" y="192" fill="#172033" font-size="14" font-weight="700">Clean and classify</text><text x="264" y="211" fill="#5c667a" font-size="10">missing · duplicate · personal</text><rect x="434" y="140" width="156" height="86" rx="5" fill="#fff" stroke="#73839b"/><text x="450" y="168" fill="#7a4b00" font-size="11" font-weight="700">03 · CALCULATE</text><text x="450" y="192" fill="#172033" font-size="14" font-weight="700">Health indicators</text><text x="450" y="211" fill="#5c667a" font-size="10">cash · margin · working capital</text><rect x="620" y="140" width="156" height="86" rx="5" fill="#fff8e8" stroke="#b7791f"/><text x="636" y="168" fill="#7a4b00" font-size="11" font-weight="700">04 · FLAG</text><text x="636" y="192" fill="#172033" font-size="14" font-weight="700">Early warnings</text><text x="636" y="211" fill="#5c667a" font-size="10">trend · threshold · data quality</text><rect x="806" y="140" width="156" height="86" rx="5" fill="#fff" stroke="#73839b"/><text x="822" y="168" fill="#253858" font-size="11" font-weight="700">05 · INTERPRET</text><text x="822" y="192" fill="#172033" font-size="14" font-weight="700">Discuss with owner</text><text x="822" y="211" fill="#5c667a" font-size="10">cause · context · priority</text><rect x="992" y="140" width="160" height="86" rx="5" fill="#eef3f8" stroke="#253858"/><text x="1008" y="168" fill="#253858" font-size="11" font-weight="700">06 · ACT</text><text x="1008" y="192" fill="#172033" font-size="14" font-weight="700">Track improvement</text><text x="1008" y="211" fill="#5c667a" font-size="10">owner · action · review date</text></g>
<g stroke="#627087" stroke-width="1.5"><path d="M218 183H248"/><path d="M404 183H434"/><path d="M590 183H620"/><path d="M776 183H806"/><path d="M962 183H992"/></g><g fill="#627087"><path d="m241 178 7 5-7 5"/><path d="m427 178 7 5-7 5"/><path d="m613 178 7 5-7 5"/><path d="m799 178 7 5-7 5"/><path d="m985 178 7 5-7 5"/></g>
<rect x="62" y="272" width="1090" height="66" fill="#f7f9fc" stroke="#cbd2dc"/><text x="82" y="299" fill="#253858" font-size="11" font-weight="700">CONTROL CHECKS</text><text x="82" y="321" fill="#172033" font-size="11">Source completeness</text><text x="283" y="321" fill="#172033" font-size="11">Category consistency</text><text x="489" y="321" fill="#172033" font-size="11">Formula validation</text><text x="690" y="321" fill="#172033" font-size="11">Explainable alert</text><text x="879" y="321" fill="#172033" font-size="11">Owner confirmation</text><text x="1040" y="321" fill="#172033" font-size="11">Outcome review</text></g></svg>
