<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">CRM capability disposition matrix</title><desc id="d">A decision matrix assigning example capabilities to adopt, configure, integrate, build later, or validate.</desc><rect width="1200" height="520" fill="#fff"/><g font-family="Arial,sans-serif">
<rect x="48" y="42" width="1104" height="48" fill="#253858"/><g fill="#fff" font-size="12" font-weight="700"><text x="68" y="72">DISPOSITION</text><text x="270" y="72">WHEN TO USE</text><text x="650" y="72">EXAMPLE CAPABILITIES</text><text x="990" y="72">NEXT STEP</text></g>
<g font-size="13"><rect x="48" y="90" width="1104" height="76" fill="#fff" stroke="#d8dde6"/><text x="68" y="121" fill="#172033" font-weight="700">ADOPT</text><text x="68" y="144" fill="#5c667a" font-size="11">Use as provided</text><text x="270" y="132" fill="#172033">Mature standard capability; low differentiation</text><text x="650" y="132" fill="#172033">Calendars, forms, basic CRM</text><text x="990" y="132" fill="#172033">Confirm fit and owner</text>
<rect x="48" y="166" width="1104" height="76" fill="#f7f9fc" stroke="#d8dde6"/><text x="68" y="197" fill="#172033" font-weight="700">CONFIGURE</text><text x="68" y="220" fill="#5c667a" font-size="11">Use native rules</text><text x="270" y="208" fill="#172033">Business need fits platform workflow tools</text><text x="650" y="208" fill="#172033">Reminders, lead routing, follow-up</text><text x="990" y="208" fill="#172033">Design and test rules</text>
<rect x="48" y="242" width="1104" height="76" fill="#fff" stroke="#d8dde6"/><text x="68" y="273" fill="#172033" font-weight="700">INTEGRATE</text><text x="68" y="296" fill="#5c667a" font-size="11">Exchange data</text><text x="270" y="284" fill="#172033">Internal workflow needs shared customer context</text><text x="650" y="284" fill="#172033">Contacts, job status, conversations</text><text x="990" y="284" fill="#172033">Define system of record</text>
<rect x="48" y="318" width="1104" height="76" fill="#f7f9fc" stroke="#d8dde6"/><text x="68" y="349" fill="#172033" font-weight="700">BUILD LATER</text><text x="68" y="372" fill="#5c667a" font-size="11">Retain differentiation</text><text x="270" y="360" fill="#172033">Capability creates proprietary operational value</text><text x="650" y="360" fill="#172033">Control layer, AI grading, coaching logic</text><text x="990" y="360" fill="#172033">Roadmap and phase</text>
<rect x="48" y="394" width="1104" height="76" fill="#fff8e8" stroke="#d6b56f"/><text x="68" y="425" fill="#5e450f" font-weight="700">VALIDATE</text><text x="68" y="448" fill="#7a5b1b" font-size="11">Resolve uncertainty</text><text x="270" y="436" fill="#172033">Fit, data, cost, or dependency remains unclear</text><text x="650" y="436" fill="#172033">White-label limits, attribution, migration</text><text x="990" y="436" fill="#172033">Pilot or diligence</text></g>
<line x1="250" y1="42" x2="250" y2="470" stroke="#d8dde6"/><line x1="630" y1="42" x2="630" y2="470" stroke="#d8dde6"/><line x1="970" y1="42" x2="970" y2="470" stroke="#d8dde6"/></g></svg>
