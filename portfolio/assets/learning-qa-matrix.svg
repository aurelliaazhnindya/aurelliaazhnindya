<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Learning platform requirements and QA traceability matrix</title><desc id="d">A matrix linking product requirements to failure risks, expected behavior, and validation evidence.</desc><rect width="1200" height="520" fill="#fff"/><g font-family="Arial,sans-serif"><rect x="48" y="42" width="1104" height="48" fill="#253858"/><g fill="#fff" font-size="11" font-weight="700"><text x="66" y="72">REQUIREMENT</text><text x="325" y="72">OBSERVED RISK</text><text x="620" y="72">EXPECTED BEHAVIOR</text><text x="980" y="72">VALIDATION</text></g><g font-size="12"><rect x="48" y="90" width="1104" height="78" fill="#fff" stroke="#d8dde6"/><text x="66" y="122" fill="#172033" font-weight="700">Preserve attempt history</text><text x="325" y="122" fill="#172033">Progress lost after session</text><text x="620" y="122" fill="#172033">Every attempt remains linked to question ID</text><text x="980" y="122" fill="#172033">Reload and compare</text><text x="980" y="142" fill="#5c667a" font-size="10">history unchanged</text><rect x="48" y="168" width="1104" height="78" fill="#f7f9fc" stroke="#d8dde6"/><text x="66" y="200" fill="#172033" font-weight="700">Apply mastery rule</text><text x="325" y="200" fill="#172033">Incorrect classification</text><text x="620" y="200" fill="#172033">Status uses accuracy and assistance level</text><text x="980" y="200" fill="#172033">Boundary tests</text><text x="980" y="220" fill="#5c667a" font-size="10">below / at / above 90%</text><rect x="48" y="246" width="1104" height="78" fill="#fff" stroke="#d8dde6"/><text x="66" y="278" fill="#172033" font-weight="700">Generate learning assets</text><text x="325" y="278" fill="#172033">Empty flashcard/interview state</text><text x="620" y="278" fill="#172033">Eligible question creates required content</text><text x="980" y="278" fill="#172033">Content count</text><text x="980" y="298" fill="#5c667a" font-size="10">source remains separated</text><rect x="48" y="324" width="1104" height="78" fill="#f7f9fc" stroke="#d8dde6"/><text x="66" y="356" fill="#172033" font-weight="700">Support navigation</text><text x="325" y="356" fill="#172033">Learner cannot return</text><text x="620" y="356" fill="#172033">Back navigation preserves current state</text><text x="980" y="356" fill="#172033">Navigate both ways</text><text x="980" y="376" fill="#5c667a" font-size="10">answers remain saved</text><rect x="48" y="402" width="1104" height="78" fill="#fff8e8" stroke="#d6b56f"/><text x="66" y="434" fill="#5e450f" font-weight="700">Maintain content inventory</text><text x="325" y="434" fill="#172033">Questions missing from target set</text><text x="620" y="434" fill="#172033">Reconciled source count and stable IDs</text><text x="980" y="434" fill="#172033">Source-to-system</text><text x="980" y="454" fill="#5c667a" font-size="10">count reconciliation</text></g><line x1="305" y1="42" x2="305" y2="480" stroke="#d8dde6"/><line x1="600" y1="42" x2="600" y2="480" stroke="#d8dde6"/><line x1="960" y1="42" x2="960" y2="480" stroke="#d8dde6"/></g></svg>
