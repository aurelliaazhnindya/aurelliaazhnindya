<title id="t">Field operations workflow and controls</title><desc id="d">A six-stage operating workflow with required evidence and control gates.</desc><rect width="1200" height="470" fill="#fff"/>
<g font-family="Arial,sans-serif">
<rect x="48" y="105" width="1104" height="72" fill="#e9eef5" stroke="#cbd2dc"/><g fill="#253858" font-size="12" font-weight="700"><text x="140" y="134" text-anchor="middle">PRE-JOB</text><text x="333" y="134" text-anchor="middle">ARRIVAL</text><text x="526" y="134" text-anchor="middle">ASSESSMENT</text><text x="719" y="134" text-anchor="middle">SERVICE</text><text x="912" y="134" text-anchor="middle">CLOSEOUT</text><text x="1060" y="134" text-anchor="middle">FOLLOW-UP</text></g><g fill="#5c667a" font-size="11"><text x="140" y="156" text-anchor="middle">Readiness</text><text x="333" y="156" text-anchor="middle">Job start</text><text x="526" y="156" text-anchor="middle">Required diagnosis</text><text x="719" y="156" text-anchor="middle">Work performed</text><text x="912" y="156" text-anchor="middle">Completion evidence</text><text x="1060" y="156" text-anchor="middle">Review &amp; coaching</text></g>
<g><rect x="62" y="205" width="156" height="82" rx="5" fill="#fff" stroke="#73839b"/><text x="78" y="232" fill="#7a4b00" font-size="11" font-weight="700">01 · ASSIGN</text><text x="78" y="256" fill="#172033" font-size="14" font-weight="700">Confirm readiness</text><text x="78" y="275" fill="#5c667a" font-size="11">skills · training · job</text>
<rect x="255" y="205" width="156" height="82" rx="5" fill="#fff" stroke="#73839b"/><text x="271" y="232" fill="#7a4b00" font-size="11" font-weight="700">02 · START</text><text x="271" y="256" fill="#172033" font-size="14" font-weight="700">Record arrival</text><text x="271" y="275" fill="#5c667a" font-size="11">time · location · status</text>
<rect x="448" y="205" width="156" height="82" rx="5" fill="#fff" stroke="#73839b"/><text x="464" y="232" fill="#7a4b00" font-size="11" font-weight="700">03 · ASSESS</text><text x="464" y="256" fill="#172033" font-size="14" font-weight="700">Complete checklist</text><text x="464" y="275" fill="#5c667a" font-size="11">findings · readings · risks</text>
<rect x="641" y="205" width="156" height="82" rx="5" fill="#fff" stroke="#73839b"/><text x="657" y="232" fill="#7a4b00" font-size="11" font-weight="700">04 · EXECUTE</text><text x="657" y="256" fill="#172033" font-size="14" font-weight="700">Perform work</text><text x="657" y="275" fill="#5c667a" font-size="11">steps · photos · readings</text>
<rect x="834" y="205" width="156" height="82" rx="5" fill="#fff" stroke="#73839b"/><text x="850" y="232" fill="#7a4b00" font-size="11" font-weight="700">05 · CLOSE</text><text x="850" y="256" fill="#172033" font-size="14" font-weight="700">Validate evidence</text><text x="850" y="275" fill="#5c667a" font-size="11">documentation · sign-off</text>
<rect x="1027" y="205" width="125" height="82" rx="5" fill="#eef3f8" stroke="#253858"/><text x="1043" y="232" fill="#253858" font-size="11" font-weight="700">06 · REVIEW</text><text x="1043" y="256" fill="#172033" font-size="14" font-weight="700">Resolve</text><text x="1043" y="275" fill="#5c667a" font-size="11">coach · monitor</text></g>
