<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Field operations workflow</title><desc id="desc">Six stages from job assignment through review and coaching, with evidence captured at each stage.</desc>
  <rect width="1200" height="390" fill="#0b1220" rx="18"/>
  <text x="54" y="58" fill="#f8fafc" font-family="Arial,sans-serif" font-size="28" font-weight="700">Field Operations — Controlled Workflow</text>
  <text x="54" y="88" fill="#94a3b8" font-family="Arial,sans-serif" font-size="15">Every stage creates evidence, a measurable event, and an exception path.</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(48 132)"><rect width="168" height="118" rx="14" fill="#162237" stroke="#2dd4bf" stroke-width="2"/><circle cx="28" cy="28" r="15" fill="#2dd4bf"/><text x="28" y="34" text-anchor="middle" fill="#082f49" font-size="14" font-weight="700">1</text><text x="20" y="68" fill="#f8fafc" font-size="17" font-weight="700">Job assigned</text><text x="20" y="94" fill="#94a3b8" font-size="13">Skills &amp; training check</text></g>
    <path d="M216 191H244" stroke="#64748b" stroke-width="3"/><path d="m238 184 8 7-8 7" fill="none" stroke="#64748b" stroke-width="3"/>
    <g transform="translate(246 132)"><rect width="168" height="118" rx="14" fill="#162237" stroke="#38bdf8" stroke-width="2"/><circle cx="28" cy="28" r="15" fill="#38bdf8"/><text x="28" y="34" text-anchor="middle" fill="#082f49" font-size="14" font-weight="700">2</text><text x="20" y="68" fill="#f8fafc" font-size="17" font-weight="700">Arrival</text><text x="20" y="94" fill="#94a3b8" font-size="13">Time &amp; location event</text></g>
    <path d="M414 191H442" stroke="#64748b" stroke-width="3"/><path d="m436 184 8 7-8 7" fill="none" stroke="#64748b" stroke-width="3"/>
    <g transform="translate(444 132)"><rect width="168" height="118" rx="14" fill="#162237" stroke="#a78bfa" stroke-width="2"/><circle cx="28" cy="28" r="15" fill="#a78bfa"/><text x="28" y="34" text-anchor="middle" fill="#2e1065" font-size="14" font-weight="700">3</text><text x="20" y="68" fill="#f8fafc" font-size="17" font-weight="700">Assessment</text><text x="20" y="94" fill="#94a3b8" font-size="13">Checklist &amp; findings</text></g>
    <path d="M612 191H640" stroke="#64748b" stroke-width="3"/><path d="m634 184 8 7-8 7" fill="none" stroke="#64748b" stroke-width="3"/>
    <g transform="translate(642 132)"><rect width="168" height="118" rx="14" fill="#162237" stroke="#fbbf24" stroke-width="2"/><circle cx="28" cy="28" r="15" fill="#fbbf24"/><text x="28" y="34" text-anchor="middle" fill="#422006" font-size="14" font-weight="700">4</text><text x="20" y="68" fill="#f8fafc" font-size="17" font-weight="700">Work executed</text><text x="20" y="94" fill="#94a3b8" font-size="13">Readings &amp; photos</text></g>
    <path d="M810 191H838" stroke="#64748b" stroke-width="3"/><path d="m832 184 8 7-8 7" fill="none" stroke="#64748b" stroke-width="3"/>
    <g transform="translate(840 132)"><rect width="168" height="118" rx="14" fill="#162237" stroke="#fb7185" stroke-width="2"/><circle cx="28" cy="28" r="15" fill="#fb7185"/><text x="28" y="34" text-anchor="middle" fill="#4c0519" font-size="14" font-weight="700">5</text><text x="20" y="68" fill="#f8fafc" font-size="17" font-weight="700">Closeout</text><text x="20" y="94" fill="#94a3b8" font-size="13">Evidence &amp; signature</text></g>
    <path d="M1008 191H1036" stroke="#64748b" stroke-width="3"/><path d="m1030 184 8 7-8 7" fill="none" stroke="#64748b" stroke-width="3"/>
    <g transform="translate(1038 132)"><rect width="114" height="118" rx="14" fill="#162237" stroke="#2dd4bf" stroke-width="2"/><circle cx="28" cy="28" r="15" fill="#2dd4bf"/><text x="28" y="34" text-anchor="middle" fill="#082f49" font-size="14" font-weight="700">6</text><text x="16" y="68" fill="#f8fafc" font-size="16" font-weight="700">Review</text><text x="16" y="91" fill="#94a3b8" font-size="12">Coach &amp;</text><text x="16" y="108" fill="#94a3b8" font-size="12">monitor</text></g>
  </g>
  <rect x="48" y="290" width="1104" height="54" rx="12" fill="#111c2e"/><text x="72" y="323" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15">Control principle:</text><text x="198" y="323" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15" font-weight="700">mandatory steps cannot be skipped; exceptions remain visible until resolved.</text>
</svg>
