<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="585" viewBox="30 85 1140 555" role="img" aria-labelledby="t d"><title id="t">Field operations dashboard specification mockup</title><desc id="d">A restrained dashboard mockup with fictional compliance, quality, rework, and exceptions data.</desc><rect width="1200" height="680" fill="#f4f6f9"/><g font-family="Arial,sans-serif">
<g><rect x="40" y="98" width="258" height="104" fill="#fff" stroke="#d8dde6"/><text x="58" y="126" fill="#5c667a" font-size="11" font-weight="700">REQUIRED-STEP COMPLIANCE</text><text x="58" y="172" fill="#172033" font-size="31" font-weight="700">94.2%</text><text x="190" y="170" fill="#2c6846" font-size="12">▲ 2.6 pts</text>
<rect x="321" y="98" width="258" height="104" fill="#fff" stroke="#d8dde6"/><text x="339" y="126" fill="#5c667a" font-size="11" font-weight="700">FIRST-PASS QUALITY</text><text x="339" y="172" fill="#172033" font-size="31" font-weight="700">88.7%</text><text x="471" y="170" fill="#2c6846" font-size="12">▲ 1.8 pts</text>
<rect x="602" y="98" width="258" height="104" fill="#fff" stroke="#d8dde6"/><text x="620" y="126" fill="#5c667a" font-size="11" font-weight="700">REWORK RATE</text><text x="620" y="172" fill="#172033" font-size="31" font-weight="700">6.4%</text><text x="721" y="170" fill="#2c6846" font-size="12">▼ 0.9 pts</text>
<rect x="883" y="98" width="277" height="104" fill="#fff" stroke="#d8dde6"/><text x="901" y="126" fill="#5c667a" font-size="11" font-weight="700">OPEN MATERIAL EXCEPTIONS</text><text x="901" y="172" fill="#172033" font-size="31" font-weight="700">17</text><text x="955" y="170" fill="#8a4b20" font-size="12">5 require review</text></g>
<rect x="40" y="226" width="700" height="398" fill="#fff" stroke="#d8dde6"/><text x="60" y="258" fill="#172033" font-size="16" font-weight="700">Weekly performance trend</text><text x="60" y="279" fill="#5c667a" font-size="11">Compliance and first-pass quality</text><line x1="100" y1="560" x2="700" y2="560" stroke="#9aa5b5"/><line x1="100" y1="310" x2="100" y2="560" stroke="#9aa5b5"/><g fill="#5c667a" font-size="11"><text x="70" y="316">100%</text><text x="76" y="440">90%</text><text x="76" y="564">80%</text><text x="142" y="583">W1</text><text x="292" y="583">W2</text><text x="442" y="583">W3</text><text x="592" y="583">W4</text></g><polyline points="150,397 300,380 450,354 600,338 680,327" fill="none" stroke="#253858" stroke-width="3"/><polyline points="150,480 300,456 450,443 600,417 680,405" fill="none" stroke="#b7791f" stroke-width="3"/><text x="110" y="610" fill="#253858" font-size="11">— Compliance</text><text x="215" y="610" fill="#8a5b10" font-size="11">— First-pass quality</text>
