<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">MSME business health dashboard</title><desc id="d">A fictional business dashboard showing cash, margin, receivables, inventory, warnings, and a weekly cash trend.</desc><rect width="1200" height="600" fill="#f4f6f9"/><g font-family="Arial,sans-serif"><g><rect x="40" y="34" width="258" height="100" fill="#fff" stroke="#d8dde6"/><text x="58" y="62" fill="#5c667a" font-size="11" font-weight="700">CASH AVAILABLE</text><text x="58" y="103" fill="#172033" font-size="27" font-weight="700">Rp 18.4m</text><rect x="321" y="34" width="258" height="100" fill="#fff" stroke="#d8dde6"/><text x="339" y="62" fill="#5c667a" font-size="11" font-weight="700">GROSS MARGIN</text><text x="339" y="103" fill="#172033" font-size="27" font-weight="700">31.8%</text><rect x="602" y="34" width="258" height="100" fill="#fff" stroke="#d8dde6"/><text x="620" y="62" fill="#5c667a" font-size="11" font-weight="700">RECEIVABLES OUTSTANDING</text><text x="620" y="103" fill="#172033" font-size="27" font-weight="700">Rp 7.2m</text><rect x="883" y="34" width="277" height="100" fill="#fff8e8" stroke="#d6b56f"/><text x="901" y="62" fill="#7a5b1b" font-size="11" font-weight="700">ACTIVE WARNINGS</text><text x="901" y="103" fill="#172033" font-size="27" font-weight="700">3</text><text x="948" y="102" fill="#7a5b1b" font-size="11">owner review needed</text></g>
<rect x="40" y="160" width="700" height="392" fill="#fff" stroke="#d8dde6"/><text x="60" y="194" fill="#172033" font-size="15" font-weight="700">Weekly cash movement</text><line x1="102" y1="480" x2="700" y2="480" stroke="#9aa5b5"/><line x1="102" y1="236" x2="102" y2="480" stroke="#9aa5b5"/><g fill="#5c667a" font-size="10"><text x="66" y="241">Rp 8m</text><text x="66" y="362">Rp 4m</text><text x="78" y="484">Rp 0</text><text x="138" y="505">W1</text><text x="288" y="505">W2</text><text x="438" y="505">W3</text><text x="588" y="505">W4</text></g><polyline points="145,310 295,345 445,328 595,405 682,388" fill="none" stroke="#253858" stroke-width="3"/><circle cx="145" cy="310" r="4" fill="#253858"/><circle cx="295" cy="345" r="4" fill="#253858"/><circle cx="445" cy="328" r="4" fill="#253858"/><circle cx="595" cy="405" r="4" fill="#253858"/><circle cx="682" cy="388" r="4" fill="#253858"/><rect x="60" y="524" width="650" height="1" fill="#d8dde6"/><text x="60" y="543" fill="#5c667a" font-size="10">Illustrative values only; actual thresholds depend on business context and data quality.</text>
<rect x="764" y="160" width="396" height="392" fill="#fff" stroke="#d8dde6"/><text x="784" y="194" fill="#172033" font-size="15" font-weight="700">Warning register</text><g font-size="12"><text x="784" y="238" fill="#7a5b1b" font-weight="700">HIGH</text><text x="840" y="238" fill="#172033">Cash declining despite sales</text><text x="784" y="263" fill="#5c667a" font-size="10">Review collections and owner withdrawals</text><line x1="784" y1="284" x2="1138" y2="284" stroke="#d8dde6"/><text x="784" y="321" fill="#7a5b1b" font-weight="700">MED</text><text x="840" y="321" fill="#172033">Receivables aging increased</text><text x="784" y="346" fill="#5c667a" font-size="10">Confirm overdue customers and follow-up</text><line x1="784" y1="367" x2="1138" y2="367" stroke="#d8dde6"/><text x="784" y="404" fill="#7a5b1b" font-weight="700">MED</text><text x="840" y="404" fill="#172033">Slow-moving inventory</text><text x="784" y="429" fill="#5c667a" font-size="10">Validate count and purchasing plan</text></g><rect x="784" y="472" width="354" height="52" fill="#eef3f8" stroke="#cbd2dc"/><text x="800" y="493" fill="#253858" font-size="10" font-weight="700">NEXT REVIEW</text><text x="800" y="513" fill="#172033" font-size="12">Owner discussion and action update</text></g></svg>
