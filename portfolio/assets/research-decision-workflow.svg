<rect x="50" y="230" width="1100" height="106" fill="#f7f9fc" stroke="#cbd2dc"/><text x="70" y="258" fill="#253858" font-size="11" font-weight="700">EVIDENCE DISCIPLINE</text><g fill="#172033" font-size="11"><text x="70" y="290">Verified source</text><text x="267" y="290">Analytical assumption</text><text x="487" y="290">Sensitivity / scenario</text><text x="697" y="290">Unresolved question</text><text x="905" y="290">Diligence action</text></g><g fill="#5c667a" font-size="9"><text x="70" y="310">traceable and dated</text><text x="267" y="310">stated explicitly</text><text x="487" y="310">range, not false precision</text><text x="697" y="310">visible to decision-maker</text><text x="905" y="310">owner and priority assigned</text></g></g></svg>
