<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d"><title id="t">Market and investment research workflow</title><desc id="d">A six-step research workflow from decision framing to recommendation and diligence actions.</desc><rect width="1200" height="400" fill="#fff"/><g font-family="Arial,sans-serif"><g><rect x="50" y="88" width="160" height="92" rx="5" fill="#fff" stroke="#73839b"/><text x="68" y="118" fill="#7a4b00" font-size="10" font-weight="700">01 · FRAME</text><text x="68" y="143" fill="#172033" font-size="13" font-weight="700">Define decision</text><text x="68" y="162" fill="#5c667a" font-size="10">scope · hypotheses · criteria</text><rect x="238" y="88" width="160" height="92" rx="5" fill="#fff" stroke="#73839b"/><text x="256" y="118" fill="#7a4b00" font-size="10" font-weight="700">02 · SIZE</text><text x="256" y="143" fill="#172033" font-size="13" font-weight="700">Assess market</text><text x="256" y="162" fill="#5c667a" font-size="10">segments · drivers · TAM</text><rect x="426" y="88" width="160" height="92" rx="5" fill="#fff" stroke="#73839b"/><text x="444" y="118" fill="#7a4b00" font-size="10" font-weight="700">03 · BENCHMARK</text><text x="444" y="143" fill="#172033" font-size="13" font-weight="700">Map competition</text><text x="444" y="162" fill="#5c667a" font-size="10">position · differentiation</text><rect x="614" y="88" width="160" height="92" rx="5" fill="#fff" stroke="#73839b"/><text x="632" y="118" fill="#253858" font-size="10" font-weight="700">04 · TEST</text><text x="632" y="143" fill="#172033" font-size="13" font-weight="700">Review economics</text><text x="632" y="162" fill="#5c667a" font-size="10">model · margin · scenario</text><rect x="802" y="88" width="160" height="92" rx="5" fill="#fff" stroke="#73839b"/><text x="820" y="118" fill="#253858" font-size="10" font-weight="700">05 · CHALLENGE</text><text x="820" y="143" fill="#172033" font-size="13" font-weight="700">Identify risks</text><text x="820" y="162" fill="#5c667a" font-size="10">commercial · operational</text><rect x="990" y="88" width="160" height="92" rx="5" fill="#eef3f8" stroke="#253858"/><text x="1008" y="118" fill="#253858" font-size="10" font-weight="700">06 · SYNTHESIZE</text><text x="1008" y="143" fill="#172033" font-size="13" font-weight="700">Recommend</text><text x="1008" y="162" fill="#5c667a" font-size="10">decision · conditions · next steps</text></g>
