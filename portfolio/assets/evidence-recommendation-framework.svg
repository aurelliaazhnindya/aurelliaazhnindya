<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Evidence to recommendation framework</title><desc id="d">A framework that separates verified evidence, assumptions, sensitivities, and open questions before forming a recommendation.</desc><rect width="1200" height="500" fill="#fff"/><g font-family="Arial,sans-serif"><rect x="48" y="48" width="684" height="356" fill="#f7f9fc" stroke="#cbd2dc"/><rect x="48" y="48" width="684" height="46" fill="#253858"/><g fill="#fff" font-size="11" font-weight="700"><text x="67" y="77">EVIDENCE CLASS</text><text x="270" y="77">WHAT IT CONTAINS</text><text x="535" y="77">HOW IT IS USED</text></g><g font-size="12"><rect x="48" y="94" width="684" height="72" fill="#fff" stroke="#d8dde6"/><text x="67" y="126" fill="#172033" font-weight="700">Verified</text><text x="270" y="126" fill="#172033">Sourced market and company facts</text><text x="535" y="126" fill="#172033">Base case</text><rect x="48" y="166" width="684" height="72" fill="#f7f9fc" stroke="#d8dde6"/><text x="67" y="198" fill="#172033" font-weight="700">Assumption</text><text x="270" y="198" fill="#172033">Reasoned but unconfirmed input</text><text x="535" y="198" fill="#172033">Disclose and test</text><rect x="48" y="238" width="684" height="72" fill="#fff" stroke="#d8dde6"/><text x="67" y="270" fill="#172033" font-weight="700">Sensitivity</text><text x="270" y="270" fill="#172033">Range around uncertain drivers</text><text x="535" y="270" fill="#172033">Compare scenarios</text><rect x="48" y="310" width="684" height="72" fill="#fff8e8" stroke="#d6b56f"/><text x="67" y="342" fill="#5e450f" font-weight="700">Open question</text><text x="270" y="342" fill="#172033">Evidence required before decision</text><text x="535" y="342" fill="#172033">Diligence item</text></g><line x1="250" y1="48" x2="250" y2="382" stroke="#d8dde6"/><line x1="515" y1="48" x2="515" y2="382" stroke="#d8dde6"/>
<path d="M732 226H792" stroke="#627087" stroke-width="1.5"/><path d="m785 221 7 5-7 5" fill="#627087"/><rect x="792" y="68" width="360" height="316" fill="#fff" stroke="#73839b"/><text x="816" y="103" fill="#253858" font-size="11" font-weight="700">DECISION OUTPUT</text><line x1="816" y1="121" x2="1128" y2="121" stroke="#d8dde6"/><text x="816" y="155" fill="#172033" font-size="12" font-weight="700">Recommendation</text><text x="816" y="176" fill="#5c667a" font-size="10">proceed · pause · decline · investigate</text><text x="816" y="220" fill="#172033" font-size="12" font-weight="700">Rationale</text><text x="816" y="241" fill="#5c667a" font-size="10">evidence and key value drivers</text><text x="816" y="285" fill="#172033" font-size="12" font-weight="700">Conditions</text><text x="816" y="306" fill="#5c667a" font-size="10">thresholds or issues to resolve</text><text x="816" y="350" fill="#172033" font-size="12" font-weight="700">Next diligence actions</text><text x="1030" y="350" fill="#5c667a" font-size="10">owner · priority · timing</text></g></svg>
