<rect x="62" y="300" width="792" height="66" fill="#f7f9fc" stroke="#cbd2dc"/><text x="80" y="326" fill="#253858" font-size="10" font-weight="700">STATUS LOGIC</text><text x="80" y="349" fill="#172033" font-size="11">Low → Intermediate → Strong → Mastered</text><text x="370" y="349" fill="#172033" font-size="11">Mastered requires &gt;90% unassisted performance</text></g></svg>
