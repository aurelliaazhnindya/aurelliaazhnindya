<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">Learning and mastery workflow</title><desc id="d">A governed learning workflow from source question to voice response, evaluation, practice, mock interview, and mastery decision.</desc><rect width="1200" height="430" fill="#fff"/><g font-family="Arial,sans-serif"><rect x="48" y="45" width="1104" height="64" fill="#e9eef5" stroke="#cbd2dc"/><g fill="#253858" font-size="11" font-weight="700"><text x="135" y="82" text-anchor="middle">SOURCE</text><text x="315" y="82" text-anchor="middle">RESPONSE</text><text x="495" y="82" text-anchor="middle">EVALUATION</text><text x="675" y="82" text-anchor="middle">PRACTICE</text><text x="855" y="82" text-anchor="middle">INTERVIEW</text><text x="1060" y="82" text-anchor="middle">MASTERY</text></g>
<g><rect x="62" y="142" width="146" height="80" rx="5" fill="#fff" stroke="#73839b"/><text x="78" y="170" fill="#7a4b00" font-size="10" font-weight="700">01 · SELECT</text><text x="78" y="194" fill="#172033" font-size="13" font-weight="700">Chapter question</text><text x="78" y="211" fill="#5c667a" font-size="9">stable source + ID</text><rect x="242" y="142" width="146" height="80" rx="5" fill="#fff" stroke="#73839b"/><text x="258" y="170" fill="#7a4b00" font-size="10" font-weight="700">02 · ANSWER</text><text x="258" y="194" fill="#172033" font-size="13" font-weight="700">Voice response</text><text x="258" y="211" fill="#5c667a" font-size="9">attempt preserved</text><rect x="422" y="142" width="146" height="80" rx="5" fill="#fff" stroke="#73839b"/><text x="438" y="170" fill="#7a4b00" font-size="10" font-weight="700">03 · SCORE</text><text x="438" y="194" fill="#172033" font-size="13" font-weight="700">Accuracy + support</text><text x="438" y="211" fill="#5c667a" font-size="9">assistance recorded</text><rect x="602" y="142" width="146" height="80" rx="5" fill="#fff" stroke="#73839b"/><text x="618" y="170" fill="#253858" font-size="10" font-weight="700">04 · REINFORCE</text><text x="618" y="194" fill="#172033" font-size="13" font-weight="700">Flashcards</text><text x="618" y="211" fill="#5c667a" font-size="9">rephrased practice</text><rect x="782" y="142" width="146" height="80" rx="5" fill="#fff" stroke="#73839b"/><text x="798" y="170" fill="#253858" font-size="10" font-weight="700">05 · APPLY</text><text x="798" y="194" fill="#172033" font-size="13" font-weight="700">Mock interview</text><text x="798" y="211" fill="#5c667a" font-size="9">question + follow-ups</text><polygon points="1042,133 1122,182 1042,231 962,182" fill="#fff8e8" stroke="#b7791f"/><text x="1042" y="178" text-anchor="middle" fill="#172033" font-size="12" font-weight="700">Mastery</text><text x="1042" y="196" text-anchor="middle" fill="#172033" font-size="12" font-weight="700">threshold met?</text></g>
